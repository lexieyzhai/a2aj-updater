<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FNAF: Guess The Character</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="fog"></div>
  <main class="game-shell">
    <header class="title-block">
      <p class="eyebrow">Three lives. Three guesses per level.</p>
      <h1>Guess The FNAF Character</h1>
      <p class="subtitle">Open clues one by one, then lock in your guess before the night shift ends.</p>
    </header>

    <section class="hud" aria-live="polite">
      <div class="hud-item">
        <span class="label">Level</span>
        <strong id="levelValue">1</strong>
      </div>
      <div class="hud-item">
        <span class="label">Lives</span>
        <strong id="livesValue">3</strong>
      </div>
      <div class="hud-item">
        <span class="label">Guesses Left</span>
        <strong id="guessesValue">3</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Clues</h2>
      <div id="clueGrid" class="clue-grid"></div>
    </section>

    <section class="panel controls">
      <label for="guessInput">Your guess</label>
      <div class="guess-row">
        <input id="guessInput" type="text" placeholder="Type a character name" autocomplete="off" />
        <button id="guessBtn" type="button">Submit Guess</button>
      </div>
      <p id="message" class="message">Night 1 begins. Reveal a clue to start.</p>
    </section>

    <section class="panel actions">
      <button id="restartBtn" class="secondary" type="button">Restart Full Game</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
